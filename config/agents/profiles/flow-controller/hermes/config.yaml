platform_toolsets:
  cli:
    - kanban
    - terminal
    - no_mcp
memory:
  memory_enabled: false
  user_profile_enabled: false
compression:
  enabled: false
terminal:
  backend: local
  home_mode: real
kanban:
  dispatch_in_gateway: true
  auto_decompose: false
  orchestrator_profile: flow-controller
  max_in_progress: 6
  max_in_progress_per_profile: 3
  max_spawn: 6
