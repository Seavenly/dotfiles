set-option -g default-terminal "tmux-256color"
set-option -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set-option -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set-option -as terminal-features ",*:hyperlinks"
set-option -as terminal-features ",xterm-ghostty:extkeys"
set-option -s extended-keys on
bind-key -n S-Enter send-keys Escape "[13;2u"
set-option -g focus-events on
set-option -g allow-passthrough on
set-option -s set-clipboard external

set-window-option -g window-status-separator " | "
set-option -g status-left-length 50
set-option -g status-right ""
set-option -g history-limit 25000
set-option -s escape-time 0
set-option -g mouse on
set-option -g status-bg "#ea9a97"

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key -r C-l last-window
bind-key -r C-p switch-client -l
bind-key -r k select-pane -U
bind-key -r j select-pane -D
bind-key -r h select-pane -L
bind-key -r l select-pane -R

bind-key C-m split-window -h "nvim ~/.tmux.conf"
bind-key C-d run-shell "sesh connect \"$(dotfiles-root)\""
bind-key C-n run-shell "sesh connect ~/notes"
bind-key C-r source-file ~/.tmux.conf \; display-message "Tmux config reloaded"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

bind-key g run-shell "~/.local/bin/tmux-lazygit"
bind-key r display-popup -d "#{pane_current_path}" -E -w 50% -h 40% "~/.local/bin/tmux-tuicr"
bind-key b display-popup -d "#{pane_current_path}" -E -w 50% -h 40% "~/.local/bin/tmux-tuicr --pick-base"
bind-key R run-shell -b "~/.local/bin/rec full >/dev/null 2>&1"
bind-key f display-popup -E -w 80% -h 70% "sesh connect \"\$(tmux-sessionizer)\""
bind-key C-a run-shell "~/.local/bin/tmux-agents"
bind-key A run-shell "~/.local/bin/tmux-ai claude 'claude --permission-mode auto'"
