schemaVersion: 1
name: agent-teams-kit
kind: mixin

commands:
  startup:
    # Find the run dir among mounted workspaces (the one with brief.md) and
    # symlink /work to it. Lets in-sandbox commands use /work/... regardless
    # of which workspace sbx made primary.
    - command:
        - sh
        - -c
        - |
          for m in $(grep virtiofs /proc/mounts | awk '{print $2}'); do
            if [ -f "$m/brief.md" ]; then
              ln -sfn "$m" /work
              exit 0
            fi
          done
          echo "agent-teams-kit: no brief.md found in mounted workspaces; /work not created" >&2
      user: 0

# Note on Agent Teams config:
# We can't deliver settings.json via files/home/.claude/settings.json — sbx
# writes its own agent-template settings.json AFTER kit files land AND after
# startup hooks run, clobbering anything we put there. Settings overlay
# happens via a post-create `sbx exec` step in the host slash command (see
# claude/commands/*.md). settings.local.json IS preserved by sbx (only
# settings.json is managed), so it ships here as a documentation marker
# and a fallback for any Claude Code version that reads it at user-level.
