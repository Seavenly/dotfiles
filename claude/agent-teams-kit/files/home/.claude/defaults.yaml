# Default cap and gate values for agent-teams flows.
# Host slash command merges these with brief-level overrides and CLI flags
# at draft time, before the brief is finalized. Agents only ever read the
# final brief.
#
# Override at the brief level by setting `config:` fields in brief.md.

feature_flow:
  max_slice_retries: 3        # how many times implementer can retry per slice
  max_critic_revisions: 1     # how many critic-driven revision cycles allowed
  plan_gate: false            # if true, lead pauses for user approval of plan
  autonomy: auto              # auto | gated — gated escalates more often

review_flow:
  max_comments: 20            # global cap; criticals/important always included
  per_tier_caps:              # optional fine-grained override
    critical: null            # null = never cap criticals
    important: null           # null = never cap important
    recommended: 10
    nit: 3
  reviewer_lenses:            # which reviewer teammates to spawn
    - security
    - correctness
    - style
    - tests

spike_flow:
  depth: deep                 # quick | deep
  prototype: false            # if true, switches mount to writable worktree
  researcher_angles: 3        # number of researcher teammates when depth=deep
