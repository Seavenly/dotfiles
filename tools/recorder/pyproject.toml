[project]
name = "dotfiles-recorder"
version = "0.1.0"
description = "Local macOS meeting recorder and transcription utilities"
requires-python = ">=3.11,<3.12"
dependencies = [
  "huggingface-hub>=0.34",
  "numpy>=2.0",
  "pyannote-audio>=3.3",
  "scipy>=1.15",
  "sounddevice>=0.5",
  "soundfile>=0.13",
  "whisperx>=3.4",
]

[tool.uv]
package = false
